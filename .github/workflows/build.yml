name: Build PokeStride IPA

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_nightly:
        description: Create a nightly release
        type: boolean
        required: false

env:
  PROJECT_NAME: PokeStride
  SCHEME_NAME: PokeStride
  BUNDLE_ID: com.pokestride.app
  archive_path: archive

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ env.PROJECT_NAME }}.ipa

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: PokeStride-iOS

      - name: Install ldid
        run: brew install ldid

      - name: Archive
        working-directory: PokeStride-iOS
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA with embedded entitlements
        working-directory: PokeStride-iOS
        run: |
          # Find the .app bundle
          APP_PATH=$(find "$archive_path.xcarchive/Products/Applications" -name "${{ env.PROJECT_NAME }}.app" -type d | head -1)
          BINARY_PATH="$APP_PATH/${{ env.PROJECT_NAME }}"
          ENTITLEMENTS="PokeStride/PokeStride.entitlements"
          
          echo "App bundle: $APP_PATH"
          echo "Binary: $BINARY_PATH"
          
          # Embed entitlements into the Mach-O binary using ldid (like Azahar/UTM)
          # This fakes code-signing with the entitlements so the runtime sees them
          # (HealthKit background delivery requires com.apple.developer.healthkit entitlement)
          ldid -S"$ENTITLEMENTS" \
               -I"${{ env.BUNDLE_ID }}" \
               "$BINARY_PATH"
          
          # Verify entitlements are embedded
          echo "=== Entitlements in binary: ==="
          ldid -e "$BINARY_PATH"
          ldid -e "$BINARY_PATH" | grep -q "healthkit" \
            && echo "OK: healthkit entitlement embedded" \
            || echo "WARNING: healthkit entitlement not found"
          
          # Copy entitlements to _CodeSignature for sideloading tools
          mkdir -p "$APP_PATH/_CodeSignature"
          plutil -convert binary1 \
            -o "$APP_PATH/_CodeSignature/entitlements.plist" \
            "$ENTITLEMENTS"
          echo "Embedded entitlements in _CodeSignature/entitlements.plist"
          
          # Create IPA directory structure
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Create the IPA (zip with .ipa extension)
          zip -r "${{ env.PROJECT_NAME }}.ipa" Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          echo "IPA created: $(ls -lh ${{ env.PROJECT_NAME }}.ipa | awk '{print $5}')"
          
          # Verify final bundle
          echo "=== Final bundle contents ==="
          ls -la "Payload/${{ env.PROJECT_NAME }}.app/" | head -15
          echo "=== Entitlements in final binary ==="
          ldid -e "Payload/${{ env.PROJECT_NAME }}.app/${{ env.PROJECT_NAME }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.sha }}
          path: PokeStride-iOS/${{ env.PROJECT_NAME }}.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Verify project structure
        working-directory: PokeStride-iOS
        run: |
          echo "Project structure:"
          find . -name "*.swift" -o -name "*.c" -o -name "*.h" | head -20
          echo ""
          echo "File counts:"
          echo "  Swift files: $(find . -name '*.swift' | wc -l)"
          echo "  C files: $(find . -name '*.c' | wc -l)"
          echo "  Header files: $(find . -name '*.h' | wc -l)"

  release:
    name: Create Release
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: PokeStride-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PokeStride.ipa
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  release_nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release_nightly || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: release_nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: PokeStride-${{ github.sha }}

      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'PokeStride Nightly Build'
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ env.COMMIT_MSG }}

            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).

            ### What's included
            - Full H8/300H PokéWalker emulator
            - HealthKit step counting (background)
            - WiFi transfer to 3DS pkwbridge
            - 4 color display modes
            - Real-time audio beeper
          files: |
            PokeStride.ipa
          prerelease: true
