name: Build PokeStride IPA

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      release_nightly:
        description: Create a nightly release
        type: boolean
        required: false

env:
  PROJECT_NAME: PokeStride
  SCHEME_NAME: PokeStride
  IOS_VERSION: '26.0'

jobs:
  build:
    name: Build iOS App
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      artifact: ${{ env.PROJECT_NAME }}.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: PokeStride-iOS

      - name: Select build configuration
        run: |
          CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "BUILD_CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Build C emulator (for simulator verification)
        working-directory: PokeStride-iOS
        run: |
          # Verify C code compiles
          cc -fsyntax-only -Weverything -Wno-gnu-zero-variadic-macro-arguments \
            -Wno-padded -Wno-covered-switch-default \
            -x c PokeStride/Emulator/h8300h.c \
            -include PokeStride/Emulator/h8300h.h
          echo "✅ C emulator core compiles cleanly"

      - name: Build iOS App (Simulator)
        working-directory: PokeStride-iOS
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -destination "generic/platform=iOS Simulator" \
            -configuration "${{ env.BUILD_CONFIG }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Build iOS App (Device)
        working-directory: PokeStride-iOS
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -destination "generic/platform=iOS" \
            -configuration "${{ env.BUILD_CONFIG }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Export IPA (unsigned)
        working-directory: PokeStride-iOS
        run: |
          APP_PATH=$(find build/DerivedData -name "${{ env.PROJECT_NAME }}.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ App bundle not found"
            exit 1
          fi

          echo "📦 Found app bundle: $APP_PATH"

          # Create Payload directory
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # Create IPA
          zip -r "${{ env.PROJECT_NAME }}.ipa" Payload/

          echo "✅ IPA created: $(ls -lh ${{ env.PROJECT_NAME }}.ipa | awk '{print $5}')"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.sha }}
          path: PokeStride-iOS/${{ env.PROJECT_NAME }}.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Verify project structure
        working-directory: PokeStride-iOS
        run: |
          echo "📂 Project structure:"
          find . -name "*.swift" -o -name "*.c" -o -name "*.h" | head -20
          echo ""
          echo "📊 File counts:"
          echo "  Swift files: $(find . -name '*.swift' | wc -l)"
          echo "  C files: $(find . -name '*.c' | wc -l)"
          echo "  Header files: $(find . -name '*.h' | wc -l)"

  release:
    name: Create Release
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: PokeStride-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PokeStride.ipa
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  release_nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release_nightly || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: release_nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: PokeStride-${{ github.sha }}

      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'PokeStride Nightly Build'
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ env.COMMIT_MSG }}

            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).

            ### What's included
            - Full H8/300H PokéWalker emulator
            - HealthKit step counting (background)
            - WiFi transfer to 3DS pkwbridge
            - 4 color display modes
            - Real-time audio beeper
          files: |
            PokeStride.ipa
          prerelease: true
